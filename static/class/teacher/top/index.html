<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Top 5 · Starve Chaos</title>
<style>
@font-face{font-family:'Oswald';font-weight:700;src:url(/fonts/oswald-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Oswald';font-weight:500;src:url(/fonts/oswald-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Source Serif 4';font-weight:400 700;src:url(/fonts/source-serif-4-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:500;src:url(/fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#16130F;color:#F4EFE6;font-family:'Source Serif 4',Georgia,serif;display:flex;flex-direction:column;padding:4vh 6vw 3vh;min-height:100vh}
.kick{font:500 clamp(13px,1.6vw,24px)/1.3 'IBM Plex Mono',monospace;letter-spacing:.16em;text-transform:uppercase;color:#E2A52B}
h1{font:700 clamp(44px,8vw,150px)/.95 'Oswald','Arial Narrow',sans-serif;text-transform:uppercase;margin:1.2vh 0 3vh}
h1 span{color:#C8401E}
ol{list-style:none;flex:1;display:flex;flex-direction:column;gap:1.6vh}
li{display:grid;grid-template-columns:auto 1fr auto;align-items:baseline;gap:3vw;border-bottom:2px solid #3a342b;padding:1.2vh 0}
.rk{font:700 clamp(36px,6vw,110px)/1 'Oswald',sans-serif;color:#17707A;min-width:1.1em}
li:first-child .rk{color:#E2A52B}
.nm{font-size:clamp(24px,3.6vw,64px);line-height:1.15;overflow-wrap:anywhere}
.sc{font:500 clamp(22px,3.2vw,56px)/1 'Oswald',sans-serif;color:#F4EFE6;white-space:nowrap}
.sc small{font-size:.5em;color:#A39C90;letter-spacing:.06em}
.empty{font-size:clamp(22px,3vw,48px);color:#A39C90;font-style:italic}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:2vh;font:500 13px/1.5 'IBM Plex Mono',monospace;color:#6B655B;letter-spacing:.08em}
.foot a{color:#A39C90}
</style></head><body>
<p class="kick" id="k">Top 5</p>
<h1 id="h">Top <span>5</span></h1>
<ol id="list"><li><span class="empty">Loading…</span></li></ol>
<div class="foot"><span>Best score per quiz counts. Updates every 15 seconds.</span><a href="/class/teacher/">Back to the teacher page</a></div>
<p class="foot" style="margin-top:6px"><span>Published by Son of a Botanist Productions LLC · © 2026 Marc Sternberg. All rights reserved.</span></p>
<script>
(function(){
  var qs=new URLSearchParams(location.search), group=qs.get("group")||"", quiz=qs.get("quiz")||"";
  function h(t){var d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML;}
  function load(){
    fetch("/api/teacher/top?group="+encodeURIComponent(group)+"&quiz="+encodeURIComponent(quiz),{credentials:"same-origin"})
    .then(function(r){return r.json();}).then(function(r){
      var list=document.getElementById("list");
      if(r.error){list.innerHTML='<li><span class="empty">Locked. Sign in on the teacher page.</span></li>';return;}
      document.getElementById("k").textContent=(group||"All groups")+" · "+r.title;
      document.getElementById("h").innerHTML=quiz?'Today’s <span>top 5</span>':'Course <span>top 5</span>';
      if(!r.top.length){list.innerHTML='<li><span class="empty">No scores yet.</span></li>';return;}
      list.innerHTML=r.top.map(function(p,i){
        return '<li><span class="rk">'+(i+1)+'</span><span class="nm">'+h(p.name)+'</span><span class="sc">'+p.score+' <small>/ '+p.outOf+'</small></span></li>';
      }).join("");
    }).catch(function(){});
  }
  load(); setInterval(load,15000);
})();
</script>
</body></html>
